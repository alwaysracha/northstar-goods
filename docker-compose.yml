services:
  # SQL Server 2025 Developer edition. This machine is the database server; data lives in the
  # mssql-data volume and survives `down` (only `down -v` deletes it). Published on localhost only.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev!Sa2026}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev!Sa2026}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  # One-shot: applies database/ scripts (idempotent, journaled in dbo.SchemaVersions) then exits.
  db-deploy:
    image: mcr.microsoft.com/mssql/server:2025-latest
    entrypoint: ["bash", "/database/deploy.sh"]
    environment:
      DB_HOST: sqlserver
      DB_NAME: ${MSSQL_DATABASE:-NorthstarGoods}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev!Sa2026}
      APP_LOGIN: northstar_app
      APP_LOGIN_PASSWORD: ${MSSQL_APP_PASSWORD:-LocalDev!App2026}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - ./database:/database:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: .
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${MSSQL_DATABASE:-NorthstarGoods};User Id=northstar_app;Password=${MSSQL_APP_PASSWORD:-LocalDev!App2026};Encrypt=True;TrustServerCertificate=True
    depends_on:
      db-deploy:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-5180}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 40s
  tests:
    build:
      context: .
      target: test
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["test"]
  browser:
    image: ghcr.io/puppeteer/puppeteer:24.16.0
    working_dir: /workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      PUPPETEER_CACHE_DIR: /home/pptruser/.cache/puppeteer
      BASE_URL: http://web:8080
      ARTIFACT_DIR: /workspace/.hermes/artifacts
      NODE_PATH: /home/pptruser/node_modules
    volumes:
      - .:/workspace
    depends_on:
      web:
        condition: service_healthy
    command: ["node", "tests/browser/storefront-smoke.js"]
    profiles: ["browser"]
volumes:
  mssql-data:
